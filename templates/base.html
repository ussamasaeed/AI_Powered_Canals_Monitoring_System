<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canal Monitoring System</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ asset_version }}">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="ripple-icon">〰</span>
      Canal Monitoring System
    </div>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Slide down dropdown menu -->
  <nav class="menu-dropdown" id="menuDropdown">
    <button class="menu-item" data-action="add-canal">Add Canal</button>
    <button class="menu-item" data-action="add-link-canal">Add Link Canal</button>
    <button class="menu-item" data-action="add-sensor">Add Sensor</button>
    <button class="menu-item" data-action="modify-sensor">Modify Sensor</button>
    <button class="menu-item" data-action="delete">Delete</button>
    <button class="menu-item" data-action="log">Log</button>
    <button class="menu-item" data-action="auto-threshold">Auto Set Threshold</button>
    <button class="menu-item" data-action="upload-data">Upload</button>
    <button class="menu-item" data-action="connect-db">Connect Database</button>
  </nav>

  <div class="body-row">
    <!-- Left nav (Home / Map tabs) -->
    <aside class="tabs-panel">
      <a href="{{ url_for('home') }}" class="tab-btn {{ 'active' if active=='home' else '' }}">Home</a>
      <a href="{{ url_for('map_page') }}" class="tab-btn {{ 'active' if active=='map' else '' }}">Map</a>
    </aside>

    <!-- Page content -->
    <main class="content-area">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<!-- ============ MODALS ============ -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ CHATBOT (floating button + panel) ============ -->
<button class="chatbot-fab" id="chatbotFab" aria-label="Ask the data assistant">
  <span class="chatbot-fab-icon">💬</span>
</button>

<div class="chatbot-panel" id="chatbotPanel">
  <div class="chatbot-panel-header">
    <span>Data Assistant</span>
    <div class="chatbot-header-actions">
      <button class="chatbot-icon-btn" id="chatbotNewBtn" title="New chat" aria-label="Start new chat">&#10022;</button>
      <button class="chatbot-icon-btn" id="chatbotDeleteBtn" title="Delete chat" aria-label="Delete chat history">&#128465;</button>
      <button class="chatbot-close-btn" id="chatbotCloseBtn" aria-label="Close chat">&times;</button>
    </div>
  </div>
  <div class="chatbot-messages" id="chatbotMessages"></div>
  <form class="chatbot-input-row" id="chatbotForm">
    <input type="text" id="chatbotInput" placeholder="Ask about your data..." autocomplete="off" />
    <button type="submit" id="chatbotSendBtn" aria-label="Send">&#10148;</button>
  </form>
</div>

<script src="{{ url_for('static', path='js/common.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', path='js/chatbot.js') }}?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
